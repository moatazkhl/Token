<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>📨 إرسال الإشعارات - لجنة باب مصر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f3ef;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #074233;
            text-align: center;
            border-bottom: 3px solid #c5a059;
            padding-bottom: 15px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #dfd5be;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
        button {
            background: #074233;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) {
            background: #0a5a44;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-refresh {
            background: #6b7280;
            margin-top: 8px;
        }
        .btn-refresh:hover:not(:disabled) {
            background: #4b5563;
        }
        .result-box {
            margin-top: 18px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            border-right: 4px solid #16a34a;
            background: #f0f7f0;
        }
        .result-box.error {
            border-right-color: #dc2626;
            background: #fef2f2;
        }
        .token-list {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            direction: ltr;
            margin-top: 8px;
        }
        .token-item {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .stat-box {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 22px;
            font-weight: bold;
            color: #074233;
        }
        .stat-label {
            font-size: 11px;
            color: #666;
        }
        .hidden {
            display: none;
        }
        .success-msg {
            color: #16a34a;
            font-weight: bold;
        }
        .error-msg {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="admin-card">
    <h1>📨 إرسال الإشعارات</h1>
    <p style="text-align:center;color:#666;margin-top:-10px;">لجنة حي باب مصر</p>

    <!-- إحصائيات -->
    <div class="stats">
        <div class="stat-box"><div class="stat-number" id="totalTokens">0</div><div class="stat-label">📱 المجموع</div></div>
        <div class="stat-box"><div class="stat-number" id="gasCount">0</div><div class="stat-label">⛽ غاز</div></div>
        <div class="stat-box"><div class="stat-number" id="petrolCount">0</div><div class="stat-label">🚗 بنزين</div></div>
        <div class="stat-box"><div class="stat-number" id="foodCount">0</div><div class="stat-label">📦 سلة</div></div>
    </div>

    <!-- نوع الإشعار -->
    <div class="form-group">
        <label>📌 نوع الإشعار:</label>
        <select id="notificationType">
            <option value="all">📢 إرسال للجميع</option>
            <option value="gas">⛽ مستفيدي الغاز</option>
            <option value="petrol">🚗 مستفيدي البنزين</option>
            <option value="food">📦 مستفيدي السلة</option>
            <option value="single">👤 مستفيد محدد</option>
        </select>
    </div>

    <!-- رقم وطني محدد -->
    <div class="form-group hidden" id="singleUserGroup">
        <label>🆔 الرقم الوطني:</label>
        <input type="text" id="targetNid" placeholder="أدخل الرقم الوطني...">
    </div>

    <!-- محتوى الإشعار -->
    <div class="form-group">
        <label>📝 العنوان:</label>
        <input type="text" id="notifTitle" value="🔔 تحديث جديد من لجنة الحي">
    </div>

    <div class="form-group">
        <label>📄 النص:</label>
        <textarea id="notifBody">السلام عليكم، يرجى مراجعة التطبيق لمعرفة حالتكم</textarea>
    </div>

    <div class="form-group">
        <label>🔗 رابط (اختياري):</label>
        <input type="text" id="notifLink" value="/">
    </div>

    <!-- أزرار -->
    <button id="sendBtn">📤 إرسال الإشعار</button>
    <button id="refreshBtn" class="btn-refresh">🔄 تحديث التوكنات</button>

    <!-- النتيجة -->
    <div id="resultBox" class="result-box">
        <h3 id="resultTitle">✅ تم الإرسال</h3>
        <p id="resultMessage"></p>
        <div id="tokenPreview" class="token-list"></div>
    </div>

    <!-- قائمة التوكنات -->
    <div style="margin-top:20px;border-top:2px solid #dfd5be;padding-top:15px;">
        <h4>📱 التوكنات المسجلة</h4>
        <div id="tokenList" class="token-list">⏳ جاري التحميل...</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // =============================================
    // إعدادات Firebase
    // =============================================
    const firebaseConfig = {
        apiKey: "AIzaSyAiHt72bzvFw8tzEPsj9uKbgWBEJGkoijU",
        authDomain: "talabat-e67b7.firebaseapp.com",
        databaseURL: "https://talabat-e67b7-default-rtdb.firebaseio.com",
        projectId: "talabat-e67b7",
        storageBucket: "talabat-e67b7.firebasestorage.app",
        messagingSenderId: "616225099801",
        appId: "1:616225099801:web:7bb54e74c6c82994959a88"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // =============================================
    // إظهار/إخفاء حقل الرقم المحدد
    // =============================================
    document.getElementById('notificationType').addEventListener('change', function() {
        const singleGroup = document.getElementById('singleUserGroup');
        singleGroup.classList.toggle('hidden', this.value !== 'single');
    });

    // =============================================
    // جلب التوكنات المسجلة
    // =============================================
    async function loadTokens() {
        const list = document.getElementById('tokenList');
        list.innerHTML = '⏳ جاري التحميل...';
        
        try {
            const snapshot = await db.ref('fcm_tokens').once('value');
            const tokens = [];
            let gas = 0, petrol = 0, food = 0;
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let key in data) {
                    const item = data[key];
                    tokens.push({
                        nid: key,
                        name: item.name || 'مجهول',
                        token: item.token || '',
                        node: item.node || ''
                    });
                    if (item.node === 'gas_queue') gas++;
                    else if (item.node === 'petrol_queue') petrol++;
                    else if (item.node === 'food_queue') food++;
                }
            }
            
            // تحديث الإحصائيات
            document.getElementById('totalTokens').textContent = tokens.length;
            document.getElementById('gasCount').textContent = gas;
            document.getElementById('petrolCount').textContent = petrol;
            document.getElementById('foodCount').textContent = food;
            
            if (tokens.length === 0) {
                list.innerHTML = `
                    <div style="color:#dc2626;padding:15px;text-align:center;background:#fef2f2;border-radius:8px;">
                        ⚠️ لا توجد توكنات مسجلة
                        <br><small style="color:#666;">افتح صفحة الاستعلام وأدخل رقم وطني لتسجيل جهازك</small>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = tokens.map(t => `
                <div class="token-item">
                    🆔 ${t.nid} - 👤 ${t.name}
                    - 📱 ${t.token ? t.token.substring(0, 20) + '...' : '❌'}
                    - 📂 ${t.node === 'gas_queue' ? '⛽ غاز' : t.node === 'petrol_queue' ? '🚗 بنزين' : '📦 سلة'}
                </div>
            `).join('');
            
        } catch (error) {
            console.error('❌ خطأ:', error);
            list.innerHTML = `
                <div style="color:#dc2626;padding:15px;text-align:center;background:#fef2f2;border-radius:8px;">
                    ❌ خطأ في جلب التوكنات: ${error.message}
                </div>
            `;
        }
    }

    // =============================================
    // إرسال الإشعار
    // =============================================
    async function sendNotificationToToken(token, title, body, link) {
        try {
            const ref = db.ref('notifications').push();
            await ref.set({
                title: title,
                body: body,
                link: link || '/',
                targetToken: token,
                timestamp: Date.now(),
                delivered: false,
                read: false
            });
            return { success: true };
        } catch (error) {
            return { success: false, error: error.message };
        }
    }

    document.getElementById('sendBtn').addEventListener('click', async function() {
        const btn = this;
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const tokenPreview = document.getElementById('tokenPreview');
        
        const type = document.getElementById('notificationType').value;
        const title = document.getElementById('notifTitle').value.trim();
        const body = document.getElementById('notifBody').value.trim();
        const link = document.getElementById('notifLink').value.trim();
        const targetNid = document.getElementById('targetNid').value.trim();

        if (!title || !body) {
            alert('❌ يرجى إدخال عنوان ونص');
            return;
        }

        if (type === 'single' && !targetNid) {
            alert('❌ يرجى إدخال الرقم الوطني');
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ جاري الإرسال...';
        resultBox.style.display = 'none';

        try {
            // جلب التوكنات
            const snapshot = await db.ref('fcm_tokens').once('value');
            let tokens = [];
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                if (type === 'all') {
                    tokens = Object.keys(data).map(key => ({ nid: key, ...data[key] }));
                } else if (type === 'single') {
                    if (data[targetNid]) {
                        tokens = [{ nid: targetNid, ...data[targetNid] }];
                    } else {
                        alert('❌ لم يتم العثور على هذا الرقم');
                        btn.disabled = false;
                        btn.textContent = '📤 إرسال الإشعار';
                        return;
                    }
                } else {
                    const map = { 'gas': 'gas_queue', 'petrol': 'petrol_queue', 'food': 'food_queue' };
                    const target = map[type];
                    tokens = Object.keys(data)
                        .filter(key => data[key].node === target)
                        .map(key => ({ nid: key, ...data[key] }));
                }
            }

            if (tokens.length === 0) {
                resultTitle.textContent = '⚠️ لا توجد توكنات';
                resultMessage.textContent = 'لا توجد أجهزة مسجلة للإرسال';
                resultBox.className = 'result-box error';
                resultBox.style.display = 'block';
                tokenPreview.innerHTML = '<div style="color:#dc2626;">⚠️ لا توجد توكنات مسجلة</div>';
                btn.disabled = false;
                btn.textContent = '📤 إرسال الإشعار';
                return;
            }

            // عرض التوكنات
            tokenPreview.innerHTML = tokens.map(t => `
                <div class="token-item">🆔 ${t.nid} - 👤 ${t.name}</div>
            `).join('');

            // إرسال
            let success = 0, fail = 0;
            for (const t of tokens) {
                if (t.token) {
                    const result = await sendNotificationToToken(t.token, title, body, link);
                    if (result.success) success++;
                    else fail++;
                } else {
                    fail++;
                }
            }

            resultTitle.textContent = '✅ تم الإرسال';
            resultMessage.textContent = `✅ نجح: ${success} | ❌ فشل: ${fail}`;
            resultBox.className = 'result-box';
            resultBox.style.display = 'block';

        } catch (error) {
            resultTitle.textContent = '❌ خطأ';
            resultMessage.textContent = error.message;
            resultBox.className = 'result-box error';
            resultBox.style.display = 'block';
        }

        btn.disabled = false;
        btn.textContent = '📤 إرسال الإشعار';
    });

    // =============================================
    // أزرار التحديث
    // =============================================
    document.getElementById('refreshBtn').addEventListener('click', loadTokens);

    // =============================================
    // التحميل عند فتح الصفحة
    // =============================================
    document.addEventListener('DOMContentLoaded', loadTokens);
</script>
</body>
</html>
